<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Modern mobile-first Internet Radio player with favorites, queue, and offline shell support." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radio" />
  <title>Internet Radio</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div id="app" class="app">
    <header class="top-header" role="banner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <circle cx="16" cy="16" r="14" fill="currentColor" opacity="0.18"/>
            <path d="M10 20v-6a6 6 0 0 1 12 0v6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            <rect x="8" y="18" width="4" height="6" rx="2" fill="currentColor"/>
            <rect x="20" y="18" width="4" height="6" rx="2" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Internet Radio</h1>
          <p class="brand-sub">Live stations worldwide</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="search-toggle" aria-label="Search stations" aria-expanded="false" aria-controls="search-panel">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="refresh-btn" aria-label="Refresh playlist">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="settings-btn" aria-label="Open settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.8 7.8 0 0 0 .05-2l2.1-1.6-2-3.4-2.5 1a7.7 7.7 0 0 0-1.7-1L14.9 2h-5.8L8.7 4a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2h5.8l.4-2a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <section id="search-panel" class="search-panel" hidden>
      <label class="search-field" for="search-input">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="Search by name, country, genre, description…" autocomplete="off" enterkeyhint="search" />
        <button type="button" class="text-btn" id="search-clear" hidden>Clear</button>
      </label>
    </section>

    <nav class="category-bar" aria-label="Station categories">
      <div class="category-scroll" id="category-list" role="tablist"></div>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1">
      <div class="view-toolbar" id="view-toolbar" hidden>
        <p class="view-hint" id="view-hint"></p>
        <div class="view-actions">
          <button type="button" class="chip-btn" id="edit-favorites-btn" hidden>Edit Favorites</button>
          <button type="button" class="chip-btn" id="done-favorites-btn" hidden>Done</button>
          <button type="button" class="chip-btn danger" id="clear-recent-btn" hidden>Clear history</button>
          <button type="button" class="chip-btn danger" id="clear-queue-btn" hidden>Clear queue</button>
        </div>
      </div>

      <div id="status-area" class="status-area" aria-live="polite">
        <div class="skeleton-grid" id="skeleton" aria-hidden="true">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>

      <section id="station-list" class="station-list" aria-label="Radio stations"></section>
      <section id="empty-state" class="empty-state" hidden></section>
    </main>

    <aside id="mini-player" class="mini-player" hidden role="region" aria-label="Mini player">
      <button type="button" class="mini-main" id="mini-open" aria-label="Open full player">
        <img id="mini-logo" class="mini-logo" alt="" width="48" height="48" />
        <div class="mini-meta">
          <strong id="mini-name">Station</strong>
          <span class="live-badge"><span class="pulse" aria-hidden="true"></span> LIVE</span>
        </div>
      </button>
      <div class="mini-actions">
        <button type="button" class="icon-btn" id="mini-fav" aria-label="Toggle favorite">♡</button>
        <button type="button" class="icon-btn play-btn" id="mini-play" aria-label="Play or pause">▶</button>
      </div>
    </aside>

    <nav class="bottom-nav" aria-label="Primary">
      <button type="button" class="nav-item active" data-view="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>Home</span>
      </button>
      <button type="button" class="nav-item" data-view="favorites">
        <span class="nav-icon" aria-hidden="true">♥</span>
        <span>Favorites</span>
      </button>
      <button type="button" class="nav-item" data-view="recent">
        <span class="nav-icon" aria-hidden="true">↺</span>
        <span>Recent</span>
      </button>
      <button type="button" class="nav-item" data-view="queue">
        <span class="nav-icon" aria-hidden="true">☰</span>
        <span>Queue</span>
      </button>
      <button type="button" class="nav-item" data-view="settings">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Full Player -->
  <div id="full-player" class="sheet full-player" hidden role="dialog" aria-modal="true" aria-labelledby="fp-name">
    <div class="sheet-backdrop" data-close="full-player"></div>
    <div class="sheet-panel player-panel">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button type="button" class="icon-btn sheet-close" data-close="full-player" aria-label="Close player">✕</button>
      <div class="player-art-wrap">
        <img id="fp-logo" class="player-art" alt="" width="280" height="280" />
        <div class="visualizer" id="visualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="player-copy">
        <h2 id="fp-name">Station</h2>
        <p id="fp-meta">Genre • Country</p>
        <p id="fp-status" class="player-status">Ready</p>
        <p id="fp-timer" class="player-timer" hidden></p>
      </div>
      <div class="player-controls">
        <button type="button" class="icon-btn" id="fp-prev" aria-label="Previous station">⏮</button>
        <button type="button" class="icon-btn play-btn large" id="fp-play" aria-label="Play or pause">▶</button>
        <button type="button" class="icon-btn" id="fp-next" aria-label="Next station">⏭</button>
      </div>
      <div class="volume-row">
        <button type="button" class="icon-btn" id="fp-mute" aria-label="Mute or unmute">🔊</button>
        <input type="range" id="fp-volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        <button type="button" class="icon-btn" id="fp-fav" aria-label="Toggle favorite">♡</button>
        <button type="button" class="icon-btn" id="fp-more" aria-label="More options">⋯</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-backdrop" data-close="settings-sheet"></div>
    <div class="sheet-panel settings-panel">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <h2 id="settings-title">Settings</h2>
        <button type="button" class="icon-btn" data-close="settings-sheet" aria-label="Close settings">✕</button>
      </header>
      <div class="settings-body">
        <label class="setting-row">
          <span>Theme</span>
          <select id="theme-select" aria-label="Theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">System</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Sleep Timer</span>
          <select id="sleep-select" aria-label="Sleep timer">
            <option value="0">Off</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">60 minutes</option>
            <option value="90">90 minutes</option>
          </select>
        </label>
        <button type="button" class="setting-action" id="settings-refresh">Refresh Playlist</button>
        <button type="button" class="setting-action danger" id="settings-clear-favorites">Clear Favorites</button>
        <button type="button" class="setting-action danger" id="settings-clear-recent">Clear Recently Played</button>
        <button type="button" class="setting-action danger" id="settings-clear-queue">Clear Queue</button>
        <div class="about-block">
          <h3>Internet Radio</h3>
          <p>Playlist powered by the GitHub radio station list.</p>
          <p class="muted">Streams play directly from each station URL. Audio is never proxied or cached by this app.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- More menu / bottom sheet -->
  <div id="more-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="more-title">
    <div class="sheet-backdrop" data-close="more-sheet"></div>
    <div class="sheet-panel more-panel">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div class="more-station">
          <img id="more-logo" alt="" width="44" height="44" />
          <div>
            <h2 id="more-title">Station</h2>
            <p id="more-sub" class="muted"></p>
          </div>
        </div>
        <button type="button" class="icon-btn" data-close="more-sheet" aria-label="Close menu">✕</button>
      </header>
      <div class="menu-list" id="more-actions"></div>
    </div>
  </div>

  <!-- Station details -->
  <div id="details-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="details-title">
    <div class="sheet-backdrop" data-close="details-sheet"></div>
    <div class="sheet-panel details-panel">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <h2 id="details-title">Station Details</h2>
        <button type="button" class="icon-btn" data-close="details-sheet" aria-label="Close details">✕</button>
      </header>
      <div class="details-body" id="details-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <audio id="audio" preload="none"></audio>
  <script src="app.js" defer></script>
</body>
</html>
